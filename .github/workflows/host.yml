name: Host validation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest opencv-python-headless
      - name: Check host correctness and relocated installation
        run: python tools/check_merge.py --profile host --output "$RUNNER_TEMP/flagcv-acceptance"
      - name: Upload FlagCV acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagcv-host-acceptance
          path: |
            ${{ runner.temp }}/flagcv-acceptance/*.json
            ${{ runner.temp }}/flagcv-acceptance/*.log
            ${{ runner.temp }}/flagcv-acceptance/*.xml
            ${{ runner.temp }}/flagcv-acceptance/build/CMakeCache.txt
