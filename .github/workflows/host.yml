name: Host validation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone Runtime
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFLAGCV_BACKENDS= -DFLAGCV_WARNINGS_AS_ERRORS=ON
          cmake --build build-host
          ctest --test-dir build-host -L host --output-on-failure
          cmake --install build-host --prefix "$RUNNER_TEMP/flagcv"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the evaluation contract and OpenCV CPU references
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest opencv-python-headless
          python -m pytest -q tests/core
